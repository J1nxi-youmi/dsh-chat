name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 新提交进来时，把同一分支上还在跑的构建取消掉，只留最新一次。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 仓库里只有 lib/ 和 pubspec，安卓工程由 flutter 自己生成
      - name: Generate android project
        run: flutter create --platforms=android --project-name dsh_chat .

      # 模板自带的 test/widget_test.dart 引用的是模板的 MyApp，和本项目无关。
      - name: Drop template test
        run: rm -f test/widget_test.dart

      - name: Patch AndroidManifest
        run: bash tool/patch_android.sh

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze > analyze.log 2>&1 || true

      - name: Build APK
        run: |
          set -o pipefail
          echo "commit: $GITHUB_SHA" > build.log
          date >> build.log
          flutter build apk --release --build-number "${{ github.run_number }}" 2>&1 | tee -a build.log

      - name: Save logs to ci-logs branch
        if: always()
        run: |
          git config user.name "DeepSeek"
          git config user.email "deepseek@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f analyze.log build.log 2>/dev/null || true
          git commit -m "logs ${{ github.run_id }} ${{ github.sha }}" || true
          git push -f origin ci-logs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 同一套 lib/，Windows 工程也由 flutter 现生成
      - name: Generate windows project
        run: flutter create --platforms=windows --project-name dsh_chat .

      - name: Drop template test
        run: Remove-Item -Force test/widget_test.dart -ErrorAction SilentlyContinue

      # just_audio_windows 的 C++/WinRT 还在用 <experimental/coroutine>，
      # 新版 MSVC 直接报 STL1011，这里加 _SILENCE_... 开关。
      - name: Patch windows CMakeLists
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/patch_windows.ps1

      - run: flutter pub get

      - name: Build Windows
        run: |
          "commit: $env:GITHUB_SHA" | Out-File -Encoding utf8 windows.log
          (Get-Date).ToUniversalTime().ToString("u") | Out-File -Encoding utf8 -Append windows.log
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows.log -Append

      - name: Save log to ci-logs-win branch
        if: always()
        shell: bash
        run: |
          git config user.name "DeepSeek"
          git config user.email "deepseek@users.noreply.github.com"
          git checkout -B ci-logs-win
          git add -f windows.log 2>/dev/null || true
          git commit -m "windows logs ${{ github.run_id }} ${{ github.sha }}" || true
          git push -f origin ci-logs-win || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-chat-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      # 用 Inno Setup 出安装包：可选安装目录、桌面快捷方式、开始菜单、卸载。
      - name: Build installer
        if: success()
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "找不到 ISCC.exe" }
          & $iscc "/DAppVersion=${{ github.run_number }}" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（$LASTEXITCODE）" }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-chat-installer
          path: dist/dsh-chat-setup.exe
          if-no-files-found: error

  # 两个平台都成功后，统一生成 release 正文（更新内容 / 下载 / 校验）并上传产物。
  release:
    needs: [apk, windows]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        run: |
          set -e
          cp dist/dsh-chat-apk/app-release.apk dist/dsh-chat.apk
          cp dist/dsh-chat-installer/dsh-chat-setup.exe dist/dsh-chat-setup.exe
          (cd dist/dsh-chat-windows && zip -qr ../dsh-chat-windows.zip .)
          ls -lh dist/*.apk dist/*.exe dist/*.zip

      - name: Write release notes
        run: |
          set -e
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          {
            echo "最新版本：v${VERSION}（构建 #${{ github.run_number }}）"
            echo
            echo "### 本版更新内容"
            echo
            git log -12 --pretty=format:'- %s'
            echo
            echo
            echo "### 下载"
            echo
            echo '- Android：`dsh-chat.apk`（传到手机安装，允许「安装未知来源」）'
            echo '- Windows 安装包：`dsh-chat-setup.exe`（可自定义安装位置、自动建桌面快捷方式）'
            echo '- Windows 便携版：`dsh-chat-windows.zip`（解压后跑 `dsh_chat.exe`）'
            echo
            echo "### 校验"
            echo
            echo '```'
            for f in dist/dsh-chat.apk dist/dsh-chat-setup.exe dist/dsh-chat-windows.zip; do
              echo "$(basename "$f")  size=$(stat -c%s "$f")  sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo "commit = ${{ github.sha }}"
            echo '```'
          } > NOTES.md
          cat NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-build >/dev/null 2>&1 \
            || gh release create latest-build --title "最新构建" --notes-file NOTES.md
          gh release upload latest-build dist/dsh-chat.apk dist/dsh-chat-setup.exe dist/dsh-chat-windows.zip --clobber
          gh release edit latest-build --title "最新构建" --notes-file NOTES.md
