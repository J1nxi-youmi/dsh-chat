name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 仓库里只有 lib/ 和 pubspec，安卓工程由 flutter 自己生成
      - name: Generate android project
        run: flutter create --platforms=android --project-name dsh_chat .

      # 模板自带的 test/widget_test.dart 引用的是模板的 MyApp，和本项目无关，
      # 留着只会让 analyze 报一堆假错误。
      - name: Drop template test
        run: rm -f test/widget_test.dart

      - name: Patch AndroidManifest
        run: bash tool/patch_android.sh

      - run: flutter pub get

      # 把分析结果也留下来，方便在仓库里直接看
      - name: Analyze
        run: flutter analyze > analyze.log 2>&1 || true

      - name: Build APK
        run: |
          set -o pipefail
          echo "commit: $GITHUB_SHA" > build.log
          date >> build.log
          flutter build apk --release 2>&1 | tee -a build.log

      - name: Save logs to ci-logs branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f analyze.log build.log 2>/dev/null || true
          git commit -m "logs ${{ github.run_id }} ${{ github.sha }}" || true
          git push -f origin ci-logs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
