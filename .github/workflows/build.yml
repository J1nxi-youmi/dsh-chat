name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 仓库里只有 lib/ 和 pubspec，安卓工程由 flutter 自己生成
      - name: Generate android project
        run: flutter create --platforms=android --project-name dsh_chat .

      # 模板自带的 test/widget_test.dart 引用的是模板的 MyApp，和本项目无关，
      # 留着只会让 analyze 报一堆假错误。
      - name: Drop template test
        run: rm -f test/widget_test.dart

      - name: Patch AndroidManifest
        run: bash tool/patch_android.sh

      - run: flutter pub get

      # 把分析结果也留下来，方便在仓库里直接看
      - name: Analyze
        run: flutter analyze > analyze.log 2>&1 || true

      - name: Build APK
        run: |
          set -o pipefail
          echo "commit: $GITHUB_SHA" > build.log
          date >> build.log
          flutter build apk --release --build-number "${{ github.run_number }}" 2>&1 | tee -a build.log

      - name: Save logs to ci-logs branch
        if: always()
        run: |
          git config user.name "DeepSeek"
          git config user.email "deepseek@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f analyze.log build.log 2>/dev/null || true
          git commit -m "logs ${{ github.run_id }} ${{ github.sha }}" || true
          git push -f origin ci-logs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Actions 的 artifact 要登录才能下，手机上很麻烦；
      # 顺手覆盖到 latest-build 这个 release，给一条能直接点开装的链接：
      #   https://github.com/J1nxi-youmi/dsh-chat/releases/latest/download/dsh-chat.apk
      - name: Publish APK to release
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dsh-chat.apk
          gh release view latest-build >/dev/null 2>&1 \
            || gh release create latest-build \
                 --title "最新构建" \
                 --notes "main 每次提交自动覆盖：dsh-chat.apk（Android）、dsh-chat-windows.zip（Windows）" \
                 || true
          gh release upload latest-build dsh-chat.apk --clobber
