name: plugin

# 插件自己的构建：只动 plugin/ 时跑，和 App 的 build.yml 完全分开。
# 版本号只认 plugin/package.json 的 version，不占 App 的构建号。
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 三个测试都只依赖 node 内置模块，不用先装依赖。
      - name: 协议可靠性（seq / 幂等 / 重发 / since）
        working-directory: plugin
        run: node test/reliability.mjs

      - name: 回合调度（跨会话并行 / 同会话串行）
        working-directory: plugin
        run: node test/turns.mjs

      - name: 桥的会话队列
        working-directory: plugin
        run: node test/session-queue.test.mjs

      - name: 插件版本检查
        working-directory: plugin
        run: node test/update.test.mjs

      - name: 插件门面（标题 / 描述 / 介绍页 / 图标）
        working-directory: plugin
        run: node test/metadata.test.mjs

  package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 读版本
        id: version
        working-directory: plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "插件版本 $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # npm pack 按 package.json 的 files 打包（lib / public / server.mjs / 补丁），
      # 产物是 dsh-plugin-chat-<version>.tgz，解包后放进 DSH 的插件目录即可。
      - name: 打包
        working-directory: plugin
        run: |
          mkdir -p ../dist
          npm pack --pack-destination ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-chat-${{ steps.version.outputs.version }}
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 发到 plugin-v<版本> 的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="plugin-v${VERSION}"
          cat > NOTES.md <<EOF
          dsh-plugin-chat v${VERSION}（提交 ${GITHUB_SHA}）

          解包 dsh-plugin-chat-${VERSION}.tgz，把 package/ 里的内容放进 DSH 的插件目录，
          在 profile 的 cordis.patch.yml 里启用（配置项见 plugin/README.md），改完重启 DSH。
          EOF
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --prerelease --title "插件 v${VERSION}" --notes-file NOTES.md
          gh release upload "$TAG" dist/*/*.tgz --repo "$REPO" --clobber
          # 插件版本永远标成「预发布」：GitHub 的 releases/latest 只认正式版，
          # 不然 App 的「检查更新」会把插件当成自己的新版本。
          gh release edit "$TAG" --repo "$REPO" --prerelease
          echo "已发布 $TAG（预发布）"

      - name: 把历史插件 Release 也标成预发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("plugin-v")) | select(.prerelease == false) | .tag_name' \
            | while read -r old; do
                [ -n "$old" ] || continue
                gh release edit "$old" --repo "$REPO" --prerelease
                echo "已把 $old 标成预发布"
              done
