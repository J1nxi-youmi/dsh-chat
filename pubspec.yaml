name: dsh_chat
description: 连接任意一台 DSH 的聊天客户端（文字 / 图片 / 链接 / 语音 / 文件）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  record: ^7.1.2
  just_audio: ^0.9.42
  just_audio_windows: ^0.2.3
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
