name: dsh_chat
description: 连接任意一台 DSH 的聊天客户端（文字 / 图片 / 链接 / 语音 / 文件）
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # 13.x 是联邦插件：Android 端用 flutter.compileSdkVersion 编译，
  # 不再像 8.x 那样硬编码 compileSdk 34，AAR 校验才能过。
  file_picker: ^13.3.3
  record: ^7.1.2
  # 和 just_audio_windows 0.2.3 配套的是 0.10.x 的方法通道协议
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  intl: ^0.19.0
  # Windows 的系统通知（Android 的通知走原生通道，不用这个包）
  local_notifier: ^0.1.6
  # 桌面窗口初始大小 / 最小尺寸
  window_manager: ^0.6.0
  # 桌面端：拖文件进聊天框、Ctrl+V 粘贴图片
  desktop_drop: ^0.8.0
  pasteboard: ^0.6.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
